<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JARVIS FINAL</title>
<style>body{background:#000;color:#0ff;font-family:Arial;text-align:center;padding:15px}
#bloqueo{position:fixed;inset:0;background:#000;z-index:999;display:flex;flex-direction:column;justify-content:center;align-items:center}
button{padding:14px 20px;background:#0ff;border:none;border-radius:12px;font-weight:bold;margin:5px}
input{padding:12px;border-radius:10px;width:85%;margin:5px}
#log{background:#111;text-align:left;padding:10px;border-radius:10px;height:200px;overflow:auto;margin-top:10px}
.ok{color:#0f8}.bad{color:red}</style>
</head>
<body>

<div id="bloqueo"><h1>JARVIS</h1><p>CLAVE DE JEFE</p><input id="pass" type="password" placeholder="•••••••" style="text-align:center;font-size:22px;letter-spacing:5px"><br><button onclick="entrar()">ENTRAR</button><p id="err" class="bad"></p></div>

<h3>JARVIS - Naranjito</h3>
<div id="estado" class="bad">● Offline listo / Online si hay internet</div>
<button id="btnJarvis">🎤 Di JARVIS</button>
<button onclick="activarSiempre()">👂 Siempre escuchando</button>
<br>
<input id="key" placeholder="Pega clave Gemini AIza... (solo 1 vez)">
<button onclick="guardarKey()">Guardar Internet</button>
<br>
<input id="q" placeholder="Ej: que hora es, abre youtube, quien es Messi">
<button onclick="responder()">ENVIAR</button>
<div id="log"></div>

<script>
const CLAVE = "1411982";
let KEY_GEMINI = localStorage.getItem('GEMINI')||"";
document.getElementById('key').value = KEY_GEMINI;
function log(t){document.getElementById('log').innerHTML = t + "<br>" + document.getElementById('log').innerHTML}
function hablar(t){log("JARVIS: "+t); let u=new SpeechSynthesisUtterance(t); u.lang="es-EC"; speechSynthesis.speak(u)}
function entrar(){ if(document.getElementById('pass').value===CLAVE){ document.getElementById('bloqueo').style.display='none'; hablar("Bienvenido jefe, sistema 100% operativo. Sin internet puedo darte hora, bateria y abrir apps. Con internet respondo a todo"); document.getElementById('estado').innerText="🟢 CONECTADO JEFE"; document.getElementById('estado').className="ok"; } else { document.getElementById('err').innerText="Clave incorrecta"; }}
function guardarKey(){ KEY_GEMINI=document.getElementById('key').value; localStorage.setItem('GEMINI',KEY_GEMINI); hablar("Internet guardado, ahora funciono con internet tambien"); }

// --- FUNCIONA SIN INTERNET ---
function sinInternet(txt){
 txt=txt.toLowerCase();
 if(txt.includes("hora")){ hablar("Son las "+new Date().toLocaleTimeString()); return true; }
 if(txt.includes("fecha")){ hablar("Hoy es "+new Date().toLocaleDateString()); return true; }
 if(txt.includes("bateria")){ navigator.getBattery().then(b=>hablar("Bateria al "+Math.round(b.level*100)+" por ciento")); return true; }
 if(txt.includes("chiste")){ hablar("Por qué los programadores prefieren el frio? Porque les gustan las ventanas abiertas"); return true; }
 if(txt.includes("youtube")){ window.open("https://m.youtube.com","_blank"); hablar("Abriendo YouTube"); return true; }
 if(txt.includes("whatsapp")){ window.open("https://wa.me/","_blank"); hablar("Abriendo WhatsApp"); return true; }
 if(txt.includes("maps")||txt.includes("naranjito")){ window.open("https://www.google.com/maps/search/Naranjito+Guayas","_blank"); hablar("Abriendo mapas"); return true; }
 if(txt.includes("linterna")){ hablar("En Android puedo prender linterna, en iPhone Apple no deja desde web"); return true; }
 return false;
}

// --- FUNCIONA CON INTERNET ---
async function conInternet(txt){
 if(!KEY_GEMINI){ hablar("Para usar internet, pega tu clave de Gemini arriba y dale Guardar Internet. Mientras tanto solo funciono sin internet"); return; }
 if(!navigator.onLine){ hablar("No hay internet, uso modo offline"); return; }
 try{
  hablar("Buscando en internet...");
  let r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${KEY_GEMINI}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({contents:[{parts:[{text:"Eres Jarvis, asistente del jefe en Ecuador. Responde corto en español: "+txt}]}]})});
  let d=await r.json(); let resp=d.candidates?.[0]?.content?.parts?.[0]?.text || "No pude conectarme";
  hablar(resp);
 }catch(e){ hablar("Error de internet, sigo en modo offline"); }
}

async function responder(){
 let txt=document.getElementById('q').value; if(!txt) return; log("TU: "+txt);
 if(sinInternet(txt)) return; // si pudo offline, no usa internet
 await conInternet(txt); // si no, usa internet
}

// VOZ TIPO SIRI
document.getElementById('btnJarvis').onclick=()=>{
 let rec=new(window.SpeechRecognition||window.webkitSpeechRecognition)(); rec.lang="es-ES"; rec.start(); log("Escuchando...");
 rec.onresult=e=>{ let t=e.results[0][0].transcript; document.getElementById('q').value=t; log("Oí: "+t); responder(); };
};
function activarSiempre(){
 let SR=window.SpeechRecognition||window.webkitSpeechRecognition; let r=new SR(); r.lang="es-ES"; r.continuous=true; r.start(); document.getElementById('estado').innerText="👂 Siempre escuchando 'Jarvis'..."; hablar("Siempre escuchando, di Jarvis");
 r.onresult=e=>{ let t=e.results[e.results.length-1][0].transcript.toLowerCase(); log("Fondo: "+t); if(t.includes("jarvis")){ hablar("Dime jefe"); let r2=new SR(); r2.lang="es-ES"; r2.start(); r2.onresult=ev=>{ document.getElementById('q').value=ev.results[0][0].transcript; responder(); } } };
}
</script>
</body>
</html>
